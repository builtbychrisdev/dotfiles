[control-center]
last-panel='sound'
window-state=(980, 640, false)

[desktop/a11y/magnifier]
cross-hairs-length=58

[desktop/app-folders]
folder-children=['YaST', 'Pardus']

[desktop/app-folders/folders/Pardus]
categories=['X-Pardus-Apps']
name='X-Pardus-Apps.directory'
translate=true

[desktop/app-folders/folders/YaST]
categories=['X-SuSE-YaST']
name='suse-yast.directory'
translate=true

[desktop/background]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///home/chris/.local/share/backgrounds/2026-09-17-21-14-32-grey_lain_wallpaper.jpg'
picture-uri-dark='file:///home/chris/.local/share/backgrounds/2026-09-17-21-14-32-grey_lain_wallpaper.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[desktop/break-reminders/eyesight]
play-sound=true

[desktop/break-reminders/movement]
duration-seconds=uint32 300
interval-seconds=uint32 1800
play-sound=true

[desktop/input-sources]
mru-sources=[('xkb', 'us')]
sources=[('xkb', 'gb')]

[desktop/interface]
color-scheme='prefer-dark'
cursor-size=24
cursor-theme='Bibata-Modern-Amber'
enable-hot-corners=false
font-antialiasing='grayscale'
font-hinting='slight'
font-name='JetBrainsMono Nerd Font Ultra-Bold 11'
font-rgba-order='rgb'
gtk-theme='Gruvbox-Dark'
icon-theme='Gruvbox-Plus-Dark'
text-scaling-factor=1.0
toolbar-icons-size='large'
toolbar-style='both-horiz'

[desktop/notifications]
application-children=['discord', 'librewolf']
show-banners=true

[desktop/notifications/application/discord]
application-id='discord.desktop'

[desktop/notifications/application/librewolf]
application-id='librewolf.desktop'

[desktop/peripherals/mouse]
accel-profile='flat'
speed=-0.30000000000000016

[desktop/peripherals/touchpad]
two-finger-scrolling-enabled=true

[desktop/screen-time-limits]
daily-limit-seconds=uint32 28800

[desktop/screensaver]
color-shading-type='solid'
picture-options='zoom'
picture-uri='file:///home/chris/.local/share/backgrounds/2026-09-17-21-14-32-grey_lain_wallpaper.jpg'
primary-color='#000000000000'
secondary-color='#000000000000'

[desktop/search-providers]
sort-order=['org.gnome.Settings.desktop', 'org.gnome.Contacts.desktop', 'org.gnome.Nautilus.desktop']

[desktop/session]
idle-delay=uint32 0

[desktop/sound]
event-sounds=true
input-feedback-sounds=false

[desktop/wm/keybindings]
close=['<Super>q', '<Alt>F4']
move-to-workspace-1=['<Super><Shift>1']
move-to-workspace-2=['<Super><Shift>2']
move-to-workspace-3=['<Super><Shift>3']
move-to-workspace-4=['<Super><Shift>4']
move-to-workspace-5=['<Super><Shift>5']
switch-to-workspace-1=['<Super>1']
switch-to-workspace-2=['<Super>2']
switch-to-workspace-3=['<Super>3']
switch-to-workspace-4=['<Super>4']
switch-to-workspace-5=['<Super>5']

[desktop/wm/preferences]
button-layout='appmenu:minimize,maximize,close'
num-workspaces=5

[mutter]
dynamic-workspaces=false

[nautilus/preferences]
migrated-gtk-settings=true

[nautilus/window-state]
initial-size=(890, 550)
initial-size-file-chooser=(890, 550)

[portal/filechooser/org.gnome.Settings]
last-folder-path='/home/chris/Pictures/wallpapers/anime'

[settings-daemon/plugins/color]
night-light-schedule-automatic=false

[settings-daemon/plugins/media-keys]
custom-keybindings=['/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom0/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom1/', '/org/gnome/settings-daemon/plugins/media-keys/custom-keybindings/custom2/']

[settings-daemon/plugins/media-keys/custom-keybindings/custom0]
binding='<Super>b'
command='librewolf'
name='Browser'

[settings-daemon/plugins/media-keys/custom-keybindings/custom1]
binding='<Super>Return'
command='kitty'
name='Terminal'

[settings-daemon/plugins/media-keys/custom-keybindings/custom2]
binding='<Super>f'
command='nautilus --new-window'
name='File manager'

[settings-daemon/plugins/power]
power-button-action='nothing'
sleep-inactive-ac-timeout=7200
sleep-inactive-ac-type='nothing'

