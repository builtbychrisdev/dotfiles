$font    = JetBrainsMono Nerd Font
$fg      = rgba(ebdbb2ff)
$yellow  = rgba(fabd2fff)
$orange  = rgba(fe8019ff)
$red     = rgba(fb4934ff)
$surface = rgba(3c3836ff)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    brightness = 0.6
    vibrancy = 0.20
}

input-field {
    monitor =
    size = 320, 55
    outline_thickness = 2
    dots_size = 0.24
    dots_spacing = 0.3
    dots_center = true
    outer_color = $yellow
    inner_color = $surface
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <i>password</i>
    check_color = $orange
    fail_color = $red
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    rounding = 10
    position = 0, -60
    halign = center
    valign = center
}

# time
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 110
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

# date
label {
    monitor =
    text = cmd[update:43200000] date +"%A, %d %B %Y"
    color = $yellow
    font_size = 22
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# user
label {
    monitor =
    text = $USER
    color = $fg
    font_size = 16
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}
